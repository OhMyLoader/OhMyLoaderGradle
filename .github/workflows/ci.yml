name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The plugin resolves loader artifacts by Maven coordinate, so CI reproduces the documented
      # dev loop: publish into mavenLocal first. Every org.ohmyloader coordinate build.gradle.kts
      # declares must be here (oml-devtools, oml-core) plus the oml-api / oml-content edges
      # oml-core's POM carries — a missing one fails as "Could not find org.ohmyloader:…". None of
      # them touch oml-native, so no zig is needed.
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish the loader coordinates this plugin resolves
        run: |
          ./gradlew -p OhMyLoader \
            :oml-devtools:publishMavenPublicationToMavenLocal \
            :oml-core:publishMavenPublicationToMavenLocal \
            :oml-api:publishMavenPublicationToMavenLocal \
            :oml-content:publishMavenPublicationToMavenLocal
      - run: ./gradlew build

  # Tag build: publish the plugin (jar + plugin marker) to GitHub Packages, versioned from
  # the tag. The loader is checked out at the SAME tag on purpose — "plugin v0.2.0" must be
  # built against "loader v0.2.0", not a moving main; the loader repository must carry the
  # tag first, so the release order is: tag the loader, then tag this repo.
  # Consumers resolve the artifact from maven.pkg.github.com — note GitHub Packages requires
  # authentication even for public-repo reads; swap the repository URL for the dedicated
  # Maven server when it exists.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          # same version tag as this release; the checkout fails if the loader tag is missing
          ref: ${{ github.ref_name }}
          path: OhMyLoader
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      # The same publish set as the build job, and the same version: this job publishes the plugin at
      # the tag version, and the plugin's own `implementation("org.ohmyloader:oml-core:$version")`
      # lines resolve that version — without -Poml_version the loader lands in mavenLocal as the
      # gradle.properties SNAPSHOT and the release cannot resolve the dependencies it declares.
      - name: Publish the loader coordinates this plugin resolves
        run: |
          ./gradlew -p OhMyLoader -Poml_version="${GITHUB_REF_NAME#v}" \
            :oml-devtools:publishMavenPublicationToMavenLocal \
            :oml-core:publishMavenPublicationToMavenLocal \
            :oml-api:publishMavenPublicationToMavenLocal \
            :oml-content:publishMavenPublicationToMavenLocal
      - run: ./gradlew -Poml_version="${GITHUB_REF_NAME#v}" publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
