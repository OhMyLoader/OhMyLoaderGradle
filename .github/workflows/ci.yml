name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The plugin resolves loader artifacts by Maven coordinate, so CI reproduces the documented
      # dev loop: publish into mavenLocal first. Every org.ohmyloader coordinate build.gradle.kts
      # declares must be here (oml-devtools, oml-core) plus the oml-api / oml-content edges
      # oml-core's POM carries — a missing one fails as "Could not find org.ohmyloader:…". None of
      # them touch oml-native, so no zig is needed.
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      # The two gradle.properties must carry the same number: this project resolves
      # org.ohmyloader:<module>:<its own version> from what the checkout publishes, so a loader
      # version bump lands as a resolution failure minutes into the build — one that reads like a
      # broken repository instead of two files that have to be aligned. The release job is exempt:
      # it overrides both sides with the tag version.
      - name: The loader version this plugin resolves must match the loader's
        run: |
          # Whitespace is stripped because Java properties accept `oml_version = x`, and the read has
          # to agree with what Gradle resolves.
          published=$(sed -n 's/[[:space:]]//g; s/^oml_version=//p' OhMyLoader/gradle.properties | head -1)
          resolved=$(sed -n 's/[[:space:]]//g; s/^oml_version=//p' gradle.properties | head -1)
          if [ "$published" != "$resolved" ]; then
            echo "::error::OhMyLoader/gradle.properties publishes $published, this repo's gradle.properties resolves $resolved — align them"
            exit 1
          fi
          echo "both at $resolved"
      # The JVM floor across the OML layer is 27.0.2 (Java 27.0.1 carries the Windows stack-probe
      # defect JDK-8394484, fixed by JDK PR 33729). No distro carries that build, so the JVM comes
      # from the raneashay/jdk-27 CI run pinned below. GitHub artifacts expire (this run:
      # 2026-11-21); when the lookup comes back empty, point JDK_RUN_ID at the latest green run of
      # https://github.com/raneashay/jdk-27/actions.
      - name: Install the 27.0.2-internal JDK bundle
        env:
          GH_TOKEN: ${{ github.token }}
          JDK_RUN_ID: '43782257129'
          JDK_BUNDLE: 'bundles-linux-x64'
        run: |
          set -euo pipefail
          id=$(gh api "repos/raneashay/jdk-27/actions/runs/$JDK_RUN_ID/artifacts?per_page=100" \
            --jq "map(select(.name == \"$JDK_BUNDLE\" and .expired == false) | .id)[0]")
          gh api "repos/raneashay/jdk-27/actions/artifacts/$id/zip" > "$RUNNER_TEMP/jdk-bundle.zip"
          mkdir -p "$RUNNER_TEMP/jdk"
          unzip -q "$RUNNER_TEMP/jdk-bundle.zip" -d "$RUNNER_TEMP/jdk"
          # The artifact may hold the JDK as a nested bundle archive or as a bare tree; open it
          # only when bin/java is not there yet.
          if ! find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | grep -q .; then
            inner=$(find "$RUNNER_TEMP/jdk" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | head -1)
            mkdir -p "$RUNNER_TEMP/jdk-x"
            case "$inner" in
              *.zip) unzip -q "$inner" -d "$RUNNER_TEMP/jdk-x" ;;
              *) tar -xzf "$inner" -C "$RUNNER_TEMP/jdk-x" ;;
            esac
            rm -rf "$RUNNER_TEMP/jdk"
            mv "$RUNNER_TEMP/jdk-x" "$RUNNER_TEMP/jdk"
          fi
          home=$(dirname "$(find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | head -1)")
          "$home/bin/java" -version
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish the loader coordinates this plugin resolves
        run: |
          ./gradlew -p OhMyLoader \
            :oml-devtools:publishMavenPublicationToMavenLocal \
            :oml-core:publishMavenPublicationToMavenLocal \
            :oml-api:publishMavenPublicationToMavenLocal \
            :oml-content:publishMavenPublicationToMavenLocal
      - run: ./gradlew build

  # Tag build: publish the plugin (jar + plugin marker) to GitHub Packages, versioned from
  # the tag. The loader is checked out at the SAME tag on purpose — "plugin v0.2.0" must be
  # built against "loader v0.2.0", not a moving main; the loader repository must carry the
  # tag first, so the release order is: tag the loader, then tag this repo.
  # Consumers resolve the artifact from maven.pkg.github.com — note GitHub Packages requires
  # authentication even for public-repo reads; swap the repository URL for the dedicated
  # Maven server when it exists.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          # same version tag as this release; the checkout fails if the loader tag is missing
          ref: ${{ github.ref_name }}
          path: OhMyLoader
      # The JVM floor across the OML layer is 27.0.2 (Java 27.0.1 carries the Windows stack-probe
      # defect JDK-8394484, fixed by JDK PR 33729). No distro carries that build, so the JVM comes
      # from the raneashay/jdk-27 CI run pinned below. GitHub artifacts expire (this run:
      # 2026-11-21); when the lookup comes back empty, point JDK_RUN_ID at the latest green run of
      # https://github.com/raneashay/jdk-27/actions.
      - name: Install the 27.0.2-internal JDK bundle
        env:
          GH_TOKEN: ${{ github.token }}
          JDK_RUN_ID: '43782257129'
          JDK_BUNDLE: 'bundles-linux-x64'
        run: |
          set -euo pipefail
          id=$(gh api "repos/raneashay/jdk-27/actions/runs/$JDK_RUN_ID/artifacts?per_page=100" \
            --jq "map(select(.name == \"$JDK_BUNDLE\" and .expired == false) | .id)[0]")
          gh api "repos/raneashay/jdk-27/actions/artifacts/$id/zip" > "$RUNNER_TEMP/jdk-bundle.zip"
          mkdir -p "$RUNNER_TEMP/jdk"
          unzip -q "$RUNNER_TEMP/jdk-bundle.zip" -d "$RUNNER_TEMP/jdk"
          # The artifact may hold the JDK as a nested bundle archive or as a bare tree; open it
          # only when bin/java is not there yet.
          if ! find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | grep -q .; then
            inner=$(find "$RUNNER_TEMP/jdk" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | head -1)
            mkdir -p "$RUNNER_TEMP/jdk-x"
            case "$inner" in
              *.zip) unzip -q "$inner" -d "$RUNNER_TEMP/jdk-x" ;;
              *) tar -xzf "$inner" -C "$RUNNER_TEMP/jdk-x" ;;
            esac
            rm -rf "$RUNNER_TEMP/jdk"
            mv "$RUNNER_TEMP/jdk-x" "$RUNNER_TEMP/jdk"
          fi
          home=$(dirname "$(find -L "$RUNNER_TEMP/jdk" -path '*/bin/java' | head -1)")
          "$home/bin/java" -version
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
      # The same publish set as the build job, and the same version: this job publishes the plugin at
      # the tag version, and the plugin's own `implementation("org.ohmyloader:oml-core:$version")`
      # lines resolve that version — without -Poml_version the loader lands in mavenLocal as the
      # gradle.properties SNAPSHOT and the release cannot resolve the dependencies it declares.
      - name: Publish the loader coordinates this plugin resolves
        run: |
          ./gradlew -p OhMyLoader -Poml_version="${GITHUB_REF_NAME#v}" \
            :oml-devtools:publishMavenPublicationToMavenLocal \
            :oml-core:publishMavenPublicationToMavenLocal \
            :oml-api:publishMavenPublicationToMavenLocal \
            :oml-content:publishMavenPublicationToMavenLocal
      - run: ./gradlew -Poml_version="${GITHUB_REF_NAME#v}" publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
